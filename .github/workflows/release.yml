name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      stable: ${{ steps.tag.outputs.stable }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RYX_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER_NAME }}
      WINDOWS_CERT_THUMBPRINT: ${{ vars.WINDOWS_CERT_THUMBPRINT }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.10'
      - name: Validate tag, approval and signing readiness
        id: tag
        run: node scripts/validate-release-tag.cjs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: windows-bun-1.3.10-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate source
        run: |
          bun run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bunx --no-install next typegen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/typescript/bin/tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/*.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows renderer
        run: bun run build
      - name: Build native Windows NSIS installer
        env:
          RYX_STABLE_RELEASE: ${{ steps.tag.outputs.stable }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bunx --no-install electron-builder --win nsis --x64 --config scripts/windows-ci-config.cjs --publish never
      - name: Verify installer and updater metadata
        run: node scripts/verify-windows-release.cjs
      - name: Verify stable Authenticode signature
        if: steps.tag.outputs.stable == 'true'
        run: |
          $files = Get-ChildItem work/windows-ci/*-Windows-Setup.exe
          if ($files.Count -ne 1) { throw 'Expected one Windows installer' }
          $sig = Get-AuthenticodeSignature $files[0].FullName
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERT_THUMBPRINT) { throw 'Installer signature verification failed' }
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-release
          if-no-files-found: error
          retention-days: 7
          path: |
            work/windows-ci/*-Windows-Setup.exe
            work/windows-ci/*-Windows-Setup.exe.blockmap
            work/windows-ci/*-Windows-Setup.exe.sha256
            work/windows-ci/latest.yml
            work/windows-ci/beta.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: windows-release
          path: release-assets
      - name: Publish complete Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          STABLE: ${{ needs.build.outputs.stable }}
        shell: bash
        run: |
          set -euo pipefail
          # Never overwrite a published version or replace existing Mac assets.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to change its assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "ryxnontop $RELEASE_TAG — Windows" --notes-file WINDOWS-RELEASE-NOTES.md
          gh release upload "$RELEASE_TAG" release-assets/*
          if [ "$STABLE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          fi
