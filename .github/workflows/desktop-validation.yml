name: Desktop validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ matrix.os }}-bun-1.3.10-${{ hashFiles('bun.lock') }}
      - name: Validate and build without launching an application
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run lint
          bunx --no-install next typegen
          node node_modules/typescript/bin/tsc --noEmit
          bun run build:electron
          node --test scripts/*.test.cjs
          bun run build
      - name: Validate Mac packaging only
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bunx --no-install electron-builder --mac --dir --arm64 --config scripts/macos-validation-config.cjs --publish never
      - name: Validate Windows packaging only
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bunx --no-install electron-builder --win --dir --x64 --config scripts/windows-ci-config.cjs --publish never
